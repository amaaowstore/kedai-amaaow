
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kedai Amaaow 🍒</title>
<style>
:root{--pink:#f8e5e9;--cream:#fffaf4;--red:#9b344d;--dark:#542b39;--sage:#a8b49a}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--dark);font-family:Arial,sans-serif}
header{background:var(--pink);text-align:center;padding:32px 16px;border-bottom:3px solid #edcbd2}
header h1{font-family:Georgia,serif;font-size:34px;margin:0;color:var(--red)}
header p{margin:10px 0 0;font-size:13px;letter-spacing:2px}
main{max-width:1000px;margin:auto;padding:22px 16px}
.intro{text-align:center;margin:12px 0 25px}
.intro h2{font-family:Georgia,serif;color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.filters button,.buy{border:0;border-radius:20px;padding:10px 16px;background:var(--red);color:white;cursor:pointer}
.filters button{background:#f1d9df;color:var(--dark)}
.filters button.active{background:var(--red);color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.product{background:white;border:1px solid #f0dce0;border-radius:16px;padding:17px;box-shadow:0 4px 12px #542b3910}
.product .emoji{font-size:28px}
.product h3{margin:9px 0;color:var(--red)}
.product p{font-size:13px;line-height:1.5;color:#80616a}
.price{font-weight:bold;font-size:17px;margin:12px 0}
.buy{width:100%}
.cart{margin-top:30px;background:var(--pink);padding:20px;border-radius:18px}
.cart h2{font-family:Georgia,serif;color:var(--red)}
.cart-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e8cbd2;font-size:14px}
.cart-item button{border:0;background:none;color:var(--red);font-weight:bold}
.checkout{width:100%;margin-top:15px;padding:14px;border:0;border-radius:12px;background:#718568;color:white;font-weight:bold;font-size:15px}
footer{text-align:center;padding:25px;background:var(--pink);margin-top:35px;font-size:13px;line-height:1.8}
a{color:var(--red)}
</style>
</head>
<body>
<header>
<h1>𐙚 Kedai Amaaow 🍒</h1>
<p>PREMIUM DIGITAL STORE · @amaaowstore</p>
</header>

<main>
<section class="intro">
<h2>α little store for your digital needs 𖹭</h2>
<p>Temukan kebutuhan premium digitalmu di sini!</p>
</section>

<div class="filters" id="filters"></div>
<section class="grid" id="products"></section>

<section class="cart">
<h2>🧺 Keranjang Belanja</h2>
<div id="cartItems">Keranjang masih kosong.</div>
<h3 id="total">Total: Rp 0</h3>
<button class="checkout" onclick="checkout()">Pesan via WhatsApp 𐙚</button>
</section>
</main>

<footer>
<b>Kedai Amaaow</b> 𖹭<br>
Instagram: @amaaowstore<br>
WhatsApp: 085941069821<br>
Terima kasih sudah berbelanja! 🍒
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hbpiaklzfcvktdqvdcil.supabase.co";
const SUPABASE_KEY = "sb_publishable_Dz4DtdMXHOyJiO4Ikh_zqA_XMy-z31P2";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let products = [];
let cart = [];
let active = "Semua";

const money = n => "Rp " + Number(n).toLocaleString("id-ID");

async function loadProducts() {
  const { data, error } = await db
    .from("products")
    .select("*")
    .order("id", { ascending: true });

  if (error) {
    document.getElementById("products").innerHTML =
      "<p>Produk belum dapat dimuat. Silakan coba lagi.</p>";
    console.error(error);
    return;
  }

  products = data || [];
  renderFilters();
  renderProducts();
  renderCart();
}

function renderFilters() {
  const cats = ["Semua", ...new Set(products.map(p => p.category))];

  document.getElementById("filters").innerHTML = cats.map(c =>
    `<button class="${active === c ? "active" : ""}"
      onclick="setCategory('${c}')">${c}</button>`
  ).join("");
}

function setCategory(c) {
  active = c;
  renderFilters();
  renderProducts();
}

function renderProducts() {
  const list = active === "Semua"
    ? products
    : products.filter(p => p.category === active);

  document.getElementById("products").innerHTML = list.map(p => {
    const i = products.indexOf(p);
    return `<article class="product">
      <div class="emoji">${p.emoji || "🍒"}</div>
      <h3>${p.name}</h3>
      <p>Kategori: ${p.category}</p>
      <div class="price">${money(p.price)}</div>
      <button class="buy" onclick="addCart(${i})">
        + Tambah ke keranjang
      </button>
    </article>`;
  }).join("");
}

function addCart(i) {
  cart.push(products[i]);
  renderCart();
}

function removeCart(i) {
  cart.splice(i, 1);
  renderCart();
}

function renderCart() {
  const el = document.getElementById("cartItems");

  if (!cart.length) {
    el.textContent = "Keranjang masih kosong.";
  } else {
    el.innerHTML = cart.map((p, i) =>
      `<div class="cart-item">
        <span>${p.name} — ${money(p.price)}</span>
        <button onclick="removeCart(${i})">Hapus</button>
      </div>`
    ).join("");
  }

  document.getElementById("total").textContent =
    "Total: " + money(cart.reduce((s, p) => s + Number(p.price), 0));
}

function checkout() {
  if (!cart.length) {
    alert("Keranjang kamu masih kosong!");
    return;
  }

  const lines = cart.map((p, i) =>
    `${i + 1}. ${p.name} - ${money(p.price)}`
  ).join("\n");

  const total = cart.reduce((s, p) => s + Number(p.price), 0);

  const msg = `Halo Kedai Amaaow! 🍒 Saya mau pesan:\n\n${lines}\n\nTotal: ${money(total)}\n\nMohon info cara pembayarannya. Terima kasih!`;

  window.open(
    "https://wa.me/6285941069821?text=" + encodeURIComponent(msg),
    "_blank"
  );
}

loadProducts();
</script>
</body>
</html>
