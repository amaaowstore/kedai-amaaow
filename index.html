
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kedai Amaaow 🍒</title>
<style>
:root{--pink:#f8e5e9;--cream:#fffaf4;--red:#9b344d;--dark:#542b39;--sage:#a8b49a}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--dark);font-family:Arial,sans-serif}
header{background:var(--pink);text-align:center;padding:32px 16px;border-bottom:3px solid #edcbd2}
header h1{font-family:Georgia,serif;font-size:34px;margin:0;color:var(--red)}
header p{margin:10px 0 0;font-size:13px;letter-spacing:2px}
main{max-width:1000px;margin:auto;padding:22px 16px}
.intro{text-align:center;margin:12px 0 25px}
.intro h2{font-family:Georgia,serif;color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.filters button,.buy{border:0;border-radius:20px;padding:10px 16px;background:var(--red);color:white;cursor:pointer}
.filters button{background:#f1d9df;color:var(--dark)}
.filters button.active{background:var(--red);color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.product{background:white;border:1px solid #f0dce0;border-radius:16px;padding:17px;box-shadow:0 4px 12px #542b3910}
.product .emoji{font-size:28px}
.product h3{margin:9px 0;color:var(--red)}
.product p{font-size:13px;line-height:1.5;color:#80616a}
.price{font-weight:bold;font-size:17px;margin:12px 0}
.buy{width:100%}
.cart{margin-top:30px;background:var(--pink);padding:20px;border-radius:18px}
.cart h2{font-family:Georgia,serif;color:var(--red)}
.cart-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e8cbd2;font-size:14px}
.cart-item button{border:0;background:none;color:var(--red);font-weight:bold}
.checkout{width:100%;margin-top:15px;padding:14px;border:0;border-radius:12px;background:#718568;color:white;font-weight:bold;font-size:15px}
footer{text-align:center;padding:25px;background:var(--pink);margin-top:35px;font-size:13px;line-height:1.8}
a{color:var(--red)}
</style>
</head>
<body>
<header>
<h1>𐙚 Kedai Amaaow 🍒</h1>
<p>PREMIUM DIGITAL STORE · @amaaowstore</p>
</header>

<main>
<section class="intro">
<h2>α little store for your digital needs 𖹭</h2>
<p>Temukan kebutuhan premium digitalmu di sini!</p>
</section>

<div class="filters" id="filters"></div>
<section class="grid" id="products"></section>

<section class="cart">
<h2>🧺 Keranjang Belanja</h2>
<div id="cartItems">Keranjang masih kosong.</div>
<h3 id="total">Total: Rp 0</h3>
<button class="checkout" onclick="checkout()">Pesan via WhatsApp 𐙚</button>
</section>
</main>

<footer>
<b>Kedai Amaaow</b> 𖹭<br>
Instagram: @amaaowstore<br>
WhatsApp: 085941069821<br>
Terima kasih sudah berbelanja! 🍒
</footer>

<script>
const products = [
{name:"Canva Harian 1 Day",price:500,cat:"Canva",emoji:"🎨"},
{name:"Canva Harian 2 Day",price:1000,cat:"Canva",emoji:"🎨"},
{name:"Canva Harian 7 Day",price:5000,cat:"Canva",emoji:"🎨"},
{name:"Canva Bulanan 1 Bulan",price:11000,cat:"Canva",emoji:"🎨"},
{name:"Canva Bulanan 3 Bulan",price:23000,cat:"Canva",emoji:"🎨"},
{name:"CapCut Sharing 7 Day",price:8000,cat:"CapCut",emoji:"🎬"},
{name:"CapCut Sharing 1 Bulan",price:19000,cat:"CapCut",emoji:"🎬"},
{name:"CapCut Private 7 Day",price:11000,cat:"CapCut",emoji:"🎬"},
{name:"CapCut Private 1 Bulan",price:32000,cat:"CapCut",emoji:"🎬"},
{name:"ChatGPT Go Sharing 3 Bulan",price:19000,cat:"ChatGPT",emoji:"🤖"},
{name:"ChatGPT Go Private 3 Bulan",price:70000,cat:"ChatGPT",emoji:"🤖"},
{name:"Disney+ Sharing 7 Day",price:11000,cat:"Disney+",emoji:"🎞️"},
{name:"Disney+ 1 Bulan 7U",price:19000,cat:"Disney+",emoji:"🎞️"},
{name:"Disney+ 1 Bulan 10U",price:17000,cat:"Disney+",emoji:"🎞️"},
{name:"Gemini AI Pro 18 Bulan",price:40000,cat:"Lainnya",emoji:"✨"},
{name:"Alight Motion 1 Tahun",price:10000,cat:"Lainnya",emoji:"🎞️"},
{name:"Spotify Famplan",price:18000,cat:"Lainnya",emoji:"🎧"},
{name:"Spotify Indplan",price:34000,cat:"Lainnya",emoji:"🎧"},
{name:"Viu Private 1 Tahun",price:20000,cat:"Lainnya",emoji:"📺"},
{name:"Wink Pro 7 Day",price:6000,cat:"Lainnya",emoji:"📸"},
{name:"Wink Pro 14 Day",price:11000,cat:"Lainnya",emoji:"📸"},
{name:"YouTube 1 Bulan",price:10000,cat:"Lainnya",emoji:"▶️"},
{name:"Zoom 14 Day",price:10000,cat:"Lainnya",emoji:"💻"},
{name:"Cek Turnitin per File",price:7000,cat:"Jasa",emoji:"📄"},
{name:"Halaman + Daftar Isi",price:10000,cat:"Jasa",emoji:"📚"},
{name:"Mendeley + Dapus 1 Sitasi",price:1000,cat:"Jasa",emoji:"📝"},
{name:"Cek AI (Quillbot)",price:3000,cat:"Jasa",emoji:"🔎"},
{name:"Jasa Ketik Word per Halaman",price:4000,cat:"Jasa",emoji:"⌨️"}
];

let cart=[];
let active="Semua";
const money=n=>"Rp "+n.toLocaleString("id-ID");

function renderFilters(){
 const cats=["Semua",...new Set(products.map(p=>p.cat))];
 document.getElementById("filters").innerHTML=cats.map(c=>
 `<button class="${active===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`
 ).join("");
}
function setCategory(c){active=c;renderFilters();renderProducts();}
function renderProducts(){
 const list=active==="Semua"?products:products.filter(p=>p.cat===active);
 document.getElementById("products").innerHTML=list.map(p=>{
 const i=products.indexOf(p);
 return `<article class="product">
 <div class="emoji">${p.emoji}</div><h3>${p.name}</h3>
 <p>Kategori: ${p.cat}</p><div class="price">${money(p.price)}</div>
 <button class="buy" onclick="addCart(${i})">+ Tambah ke keranjang</button>
 </article>`;
 }).join("");
}
function addCart(i){cart.push(products[i]);renderCart();}
function removeCart(i){cart.splice(i,1);renderCart();}
function renderCart(){
 const el=document.getElementById("cartItems");
 if(!cart.length){el.textContent="Keranjang masih kosong.";}
 else{el.innerHTML=cart.map((p,i)=>
 `<div class="cart-item"><span>${p.name} — ${money(p.price)}</span>
 <button onclick="removeCart(${i})">Hapus</button></div>`
 ).join("");}
 document.getElementById("total").textContent="Total: "+money(cart.reduce((s,p)=>s+p.price,0));
}
function checkout(){
 if(!cart.length){alert("Keranjang kamu masih kosong!");return;}
 const lines=cart.map((p,i)=>`${i+1}. ${p.name} - ${money(p.price)}`).join("\n");
 const total=cart.reduce((s,p)=>s+p.price,0);
 const msg=`Halo Kedai Amaaow! 🍒 Saya mau pesan:\n\n${lines}\n\nTotal: ${money(total)}\n\nMohon info cara pembayarannya. Terima kasih!`;
 window.open("https://wa.me/6285941069821?text="+encodeURIComponent(msg),"_blank");
}
renderFilters();renderProducts();renderCart();
</script>
</body>
</html>
